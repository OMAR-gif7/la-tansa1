# بناء APK لـ «لا تنسى» — يعمل بالكامل على GitHub Actions
# الموبايل → GitHub → Actions → APK

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {} # تشغيل يدوي من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) جلب كود المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2) إعداد Java (Capacitor 6 يتطلب Java 17)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3) إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4) تجهيز Gradle (تخزين مؤقت لتسريع البناء)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5) تثبيت Capacitor
      - name: Install dependencies
        run: npm install

      # 6) توليد مشروع Android (يتضمن Gradle Wrapper تلقائيًا)
      - name: Add Android platform
        run: npx cap add android

      # 7) نسخ ملفات الويب إلى مجلد www ثلاثيّة المزامنة
      - name: Copy web assets
        run: |
          mkdir -p www
          cp index.html style.css app.js www/

      # 8) مزامنة الويب مع مشروع Android
      - name: Sync Capacitor
        run: npx cap sync android

      # 9) منح صلاحية التنفيذ لـ gradlew
      - name: Grant execute permission
        run: chmod +x android/gradlew

      # 10) بناء Debug APK
      - name: Build Debug APK
        run: ./android/gradlew -p android assembleDebug

      # 11) رفع الـ APK كـ Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: latansa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
